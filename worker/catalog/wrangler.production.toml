# Reviewed production binding for the public, read-only exercise catalog Worker.
name = "overdrive-catalog"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true
preview_urls = false

# Catalog responses contain no user data. Invocation/application logging remains disabled.
[observability]
enabled = false

[[d1_databases]]
binding = "CATALOG_DB"
database_name = "overdrive-catalog"
database_id = "4bf0e085-56d8-405e-a7a7-333d5eeff03f"
migrations_dir = "migrations"
