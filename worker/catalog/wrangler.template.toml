# Template only. Replace the sentinel with a separately created overdrive-catalog D1 id in a
# reviewed infrastructure change. The sentinel prevents this source change from deploying.
name = "overdrive-catalog"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = false

# Catalog GETs contain no user input and must not emit invocation/application logs or telemetry.
[observability]
enabled = false

[[d1_databases]]
binding = "CATALOG_DB"
database_name = "overdrive-catalog"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
